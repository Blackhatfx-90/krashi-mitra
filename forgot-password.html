<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reset your Krashi Mitra password — Your smart AI companion for healthier crops.">
  <meta name="theme-color" content="#168A3A">
  <title>Forgot Password — Krashi Mitra</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/landing.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/landing-tour.css?v=1" />
</head>
<body>

  <main class="auth-page" id="forgot-password-page">
    <div class="auth-card">

      <!-- Logo & Branding -->
      <header class="auth-header">
        <a href="/" class="auth-header__logo">
          <img src="assets/logo-icon.png" alt="Krishi Mitra" class="auth-header__logo-icon" width="64" height="64">
          <span class="auth-header__logo-name">Krashi Mitra</span>
        </a>
        <p class="auth-header__tagline">Your smart AI companion for healthier crops.</p>

        <h1 class="auth-header__title">Forgot Password?</h1>
        <p class="auth-header__subtitle">No worries! Enter your phone number and we'll send you a reset link.</p>
      </header>

      <!-- Forgot Password Form -->
      <form class="auth-form" id="forgot-password-form" novalidate>

        <!-- Phone Number -->
        <div class="form-group">
          <label for="forgot-phone" class="form-group__label">Phone Number</label>
          <div class="form-group__input-wrapper">
            <input
              type="tel"
              id="forgot-phone"
              class="form-group__input"
              placeholder="Enter your phone number"
              autocomplete="tel"
              required
            >
          </div>
          <span class="form-group__error">Please enter your phone number</span>
        </div>

        <!-- Send Reset Link Button -->
        <button type="submit" class="btn btn--primary btn--full" id="forgot-submit-btn">Send Reset Link</button>
      </form>

      <!-- Back to Login -->
      <footer class="auth-footer" style="margin-top: var(--space-7);">
        <a href="/login" class="auth-back-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
          </svg>
          Back to Login
        </a>
      </footer>

    </div>
  </main>

  <script src="js/landing.js"></script>
<script src="js/landing-tour.js?v=1"></script>
</body>
</html>
